<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu | CineFlow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/reset-password.css}">
    <link rel="stylesheet" th:href="@{/css/customer-account.css}">
    <link rel="stylesheet" th:href="@{/css/common-header.css}">
</head>
<body class="customer-header-page">

<!-- Chen header customer dung chung. -->
<div th:replace="~{fragments/common_header :: customerHeader('', '')}"></div>

<div class="page-wrapper">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="card-container">
        <div class="card-header-section">
            <div class="icon-box">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h1>Đổi mật khẩu</h1>
            <p>Cập nhật mật khẩu để bảo vệ tài khoản của bạn</p>
        </div>

        <!-- Chi hien khi ResetPasswordController dua successMessage vao Model. -->
        <div th:if="${successMessage}" class="alert-box alert-success-box" data-auto-dismiss="5000">
            <div class="alert-icon"><i class="fas fa-check-circle"></i></div>
            <div class="alert-content">
                <strong>Thành công!</strong>
                <span th:text="${successMessage}"></span>
            </div>
            <button class="alert-close" onclick="this.closest('.alert-box').style.display='none'">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Loi tong duoc hien khi khong the gan loi vao mot field cu the. -->
        <div th:if="${formError}" class="alert-box alert-error-box" data-auto-dismiss="5000">
            <div class="alert-icon"><i class="fas fa-exclamation-circle"></i></div>
            <div class="alert-content">
                <strong>Lỗi!</strong>
                <span th:text="${formError}"></span>
            </div>
            <button class="alert-close" onclick="this.closest('.alert-box').style.display='none'">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Submit den POST /reset-password; backend tiep tuc validate de dam bao bao mat. -->
        <form th:action="@{/reset-password}" method="POST" class="reset-form" id="resetForm" novalidate>
            <div class="field-group">
                <label for="oldPassword" class="field-label">
                    <i class="fas fa-lock"></i> Mật khẩu cũ <span class="required-dot">*</span>
                </label>
                <div class="input-wrap">
                    <!-- name oldPassword khop @RequestParam trong controller. -->
                    <input type="password"
                           id="oldPassword"
                           name="oldPassword"
                           class="field-input"
                           placeholder="Nhập mật khẩu hiện tại"
                           autocomplete="current-password"
                           th:value="${oldPassword}">
                    <button type="button" class="eye-btn" onclick="toggleField('oldPassword', 'eyeOld')">
                        <i class="fas fa-eye" id="eyeOld"></i>
                    </button>
                </div>
                <!-- oldPasswordError duoc controller gan khi password cu rong/sai. -->
                <span class="field-error server-error"
                      id="errOld"
                      th:text="${oldPasswordError}"
                      th:style="${oldPasswordError} ? 'display:block;' : ''"></span>
            </div>

            <div class="section-divider">
                <span>Mật khẩu mới</span>
            </div>

            <div class="field-group">
                <label for="newPassword" class="field-label">
                    <i class="fas fa-key"></i> Mật khẩu mới <span class="required-dot">*</span>
                </label>
                <div class="input-wrap">
                    <!-- name newPassword khop @RequestParam va autocomplete bao day la password moi. -->
                    <input type="password"
                           id="newPassword"
                           name="newPassword"
                           class="field-input"
                           placeholder="8-20 ký tự"
                           autocomplete="new-password"
                           th:value="${newPassword}">
                    <button type="button" class="eye-btn" onclick="toggleField('newPassword', 'eyeNew')">
                        <i class="fas fa-eye" id="eyeNew"></i>
                    </button>
                </div>
                <!-- newPasswordError hien loi do dai/trung password cu. -->
                <span class="field-error server-error"
                      id="errNew"
                      th:text="${newPasswordError}"
                      th:style="${newPasswordError} ? 'display:block;' : ''"></span>
            </div>

            <div class="field-group">
                <label for="confirmPassword" class="field-label">
                    <i class="fas fa-check-double"></i> Xác nhận mật khẩu <span class="required-dot">*</span>
                </label>
                <div class="input-wrap">
                    <!-- confirmPassword duoc backend so sanh voi newPassword. -->
                    <input type="password"
                           id="confirmPassword"
                           name="confirmPassword"
                           class="field-input"
                           placeholder="Nhập lại mật khẩu mới"
                           autocomplete="new-password"
                           th:value="${confirmPassword}">
                    <button type="button" class="eye-btn" onclick="toggleField('confirmPassword', 'eyeConfirm')">
                        <i class="fas fa-eye" id="eyeConfirm"></i>
                    </button>
                </div>
                <!-- confirmPasswordError hien loi rong/khong khop. -->
                <span class="field-error server-error"
                      id="errConfirm"
                      th:text="${confirmPasswordError}"
                      th:style="${confirmPasswordError} ? 'display:block;' : ''"></span>
            </div>

            <div class="action-row">
                <!-- Huy va quay ve home ma khong submit. -->
                <a th:href="@{/home}" class="btn-cancel">
                    <i class="fas fa-arrow-left"></i> Hủy
                </a>
                <!-- Submit form sau khi JavaScript validate nhanh o client. -->
                <button type="submit" class="btn-submit" id="btnSubmit">
                    <span class="btn-text"><i class="fas fa-save"></i> Lưu thay đổi</span>
                    <span class="btn-loading" style="display:none"><i class="fas fa-spinner fa-spin"></i></span>
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auto-dismiss-alerts.js}"></script>
<script>
    // Doi input password qua text va doi icon mat.
    function toggleField(inputId, iconId) {
        // Tim input theo ID duoc nut truyen vao.
        const input = document.getElementById(inputId);
        // Tim icon cua dung input.
        const icon = document.getElementById(iconId);
        // Neu dang an password thi chuyen sang text.
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        // Neu dang hien thi thi chuyen lai password.
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    // Bat su kien submit de validate nhanh truoc khi gui request.
    document.getElementById('resetForm').addEventListener('submit', function (e) {
        // Doc va trim password cu.
        const old = document.getElementById('oldPassword').value.trim();
        // Doc va trim password moi.
        const np = document.getElementById('newPassword').value.trim();
        // Doc va trim password xac nhan.
        const cp = document.getElementById('confirmPassword').value.trim();
        // Gia dinh form hop le cho den khi mot rule that bai.
        let valid = true;

        // Xoa cac loi cu truoc moi lan validate.
        clearErrors();

        // Kiem tra password cu bat buoc.
        if (!old) { showError('errOld', 'Mật khẩu cũ không được để trống'); valid = false; }
        // Kiem tra password moi bat buoc.
        if (!np) { showError('errNew', 'Mật khẩu mới không được để trống'); valid = false; }
        // Kiem tra do dai password moi.
        else if (np.length < 8 || np.length > 20) { showError('errNew', 'Mật khẩu mới phải từ 8 đến 20 ký tự'); valid = false; }
        // Kiem tra password moi khac password cu.
        else if (old && np === old) { showError('errNew', 'Mật khẩu mới phải khác mật khẩu cũ'); valid = false; }
        // Kiem tra confirm bat buoc.
        if (!cp) { showError('errConfirm', 'Xác nhận mật khẩu không được để trống'); valid = false; }
        // Kiem tra confirm trung password moi.
        else if (np && cp !== np) { showError('errConfirm', 'Mật khẩu xác nhận không khớp'); valid = false; }

        // Co loi thi chan request POST.
        if (!valid) {
            e.preventDefault();
            return;
        }

        // Form hop le o client: an text nut va hien spinner.
        document.querySelector('.btn-text').style.display = 'none';
        document.querySelector('.btn-loading').style.display = 'inline-block';
    });

    // Gan message vao span loi va hen gio tu an.
    function showError(id, msg) {
        // Tim span loi theo ID.
        const el = document.getElementById(id);
        // Dat noi dung loi.
        el.textContent = msg;
        // Hien span.
        el.style.display = 'block';
        // Goi helper tu an sau 5 giay.
        scheduleFieldErrorDismiss(el);
    }

    // Xoa noi dung va an ba span loi cua form.
    function clearErrors() {
        // Lap qua danh sach ID loi.
        ['errOld', 'errNew', 'errConfirm'].forEach(id => {
            const el = document.getElementById(id);
            // Bao ve truong hop element khong ton tai.
            if (el) {
                el.textContent = '';
                el.style.display = 'none';
            }
        });
    }

    // Dat timeout de loi field tu bien mat sau 5 giay.
    function scheduleFieldErrorDismiss(el) {
        // Khong xu ly element null.
        if (!el) return;
        // Neu da co timer cu thi huy de tranh hai timer chay song song.
        if (el.dataset.dismissTimer) {
            clearTimeout(Number(el.dataset.dismissTimer));
        }
        // Tao timer moi.
        const timerId = setTimeout(() => {
            // Xoa text loi.
            el.textContent = '';
            // An span loi.
            el.style.display = 'none';
            // Xoa ID timer da het han khoi dataset.
            delete el.dataset.dismissTimer;
        }, 5000);
        // Luu ID timer tren chinh element.
        el.dataset.dismissTimer = String(timerId);
    }

    // Cac loi server render san cung duoc hen gio tu an.
    document.querySelectorAll('.field-error').forEach(errorEl => {
        // Chi dat timer cho span dang co noi dung.
        if (errorEl.textContent.trim()) {
            scheduleFieldErrorDismiss(errorEl);
        }
    });
</script>
</body>
</html>
